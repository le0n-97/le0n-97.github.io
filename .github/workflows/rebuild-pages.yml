name: Rebuild GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "squares-duel/**"
      - ".github/workflows/rebuild-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-rebuild
  cancel-in-progress: false

jobs:
  request-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request existing Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
