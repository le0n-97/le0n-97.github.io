<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ee">
  <title>心有灵犀 · 词语接力</title>
  <link rel="stylesheet" href="style.css?v=server-1">
  <script defer src="game.js?v=server-2"></script>
</head>
<body>
  <main class="shell">
    <header class="top">
      <a class="brand" href="."><span class="brand-icon">✳</span> 心有灵犀 <small>WORD SYNC</small></a>
      <span class="top-note">一个关于默契的小游戏</span>
    </header>

    <section id="home" class="home">
      <div class="intro">
        <h1>我们会想到<br><em>同一个词吗？</em></h1>
        <p>邀请朋友一起，看看你们需要几回合才能心有灵犀。</p>
        <div class="rules"><span>独立写词</span><span>同时揭晓</span><span>直到一致</span></div>
      </div>
      <div class="entry card">
        <div class="card-top"><span id="entryTitle">开始游戏</span></div>
        <p id="authStatus" class="account-status" role="status"></p>
        <button id="authRetry" type="button" class="secondary hidden">重新验证账号</button>
        <form id="authForm" class="hidden">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocapitalize="off" spellcheck="false" required>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="5" maxlength="128" required>
          <div id="confirmRow" class="hidden">
            <label for="confirmPassword">确认密码</label>
            <input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" minlength="5" maxlength="128">
          </div>
          <button id="authSubmit" class="primary" type="submit">登录</button>
          <button id="authMode" class="text-button auth-mode" type="button">注册账号</button>
        </form>
        <div id="lobbyControls" class="hidden">
          <div class="account-line">
            <span>已登录 <strong id="accountName"></strong></span>
            <button id="logout" type="button" class="text-button">退出登录</button>
          </div>
          <button id="create" class="primary" type="button">创建房间 <span>↗</span></button>
          <div id="joinDivider" class="divider"><span>或者加入朋友</span></div>
          <form id="joinForm">
            <label for="roomCode">房间码</label>
            <div class="join-row">
              <input id="roomCode" maxlength="6" placeholder="输入 6 位房间码" autocomplete="off" autocapitalize="characters" required>
              <button id="join" class="secondary" type="submit">加入 →</button>
            </div>
          </form>
          <p class="hint">至少 2 位玩家即可开始。刷新后可用同一账号回到房间。</p>
        </div>
      </div>
      <div class="scribble" aria-hidden="true">✳</div>
    </section>

    <section id="room" class="room hidden">
      <div class="room-head">
        <div>
          <div class="eyebrow">房间 <span id="codeLabel"></span> <button id="copy" class="copy" type="button">复制邀请链接 ↗</button></div>
          <h1 id="roomTitle">等待朋友加入</h1>
          <p id="status" class="muted"></p>
          <p id="roomNotice" class="room-notice hidden" role="status"></p>
        </div>
        <button id="leave" class="text-button" type="button">离开房间 ↗</button>
      </div>
      <div class="layout">
        <div class="main-column">
          <div id="stage" class="card stage"></div>
          <div class="history-head"><h2>我们的回答 <span id="roundCount">00</span></h2></div>
          <div id="history" class="history"><div class="empty">还没有揭晓的答案。</div></div>
        </div>
        <aside class="card players">
          <div class="card-top"><span>房间里的朋友</span><span id="playerCount" class="count">0</span></div>
          <div id="players"></div>
        </aside>
      </div>
    </section>
  </main>
  <div id="toast" role="status"></div>
</body>
</html>
